name: cf-region-exit-pool

on:
  schedule:
    - cron: "*/15 * * * *"   # fast scan
    - cron: "0 */6 * * *"    # deep refine
  workflow_dispatch:
    inputs:
      mode:
        description: "fast or deep"
        type: choice
        required: false
        default: "fast"
        options: ["fast", "deep"]

jobs:
  fast:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Fast scan
        run: |
          set +e
          python -u src/scanner.py 2>&1 | tee scan.log
          ec=$?
          if [ $ec -ne 0 ]; then echo "SCAN FAILED ec=$ec, last 40 lines:"; tail -40 scan.log; fi
          exit $ec
      - name: Commit + push if changed
        if: always() && !cancelled()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scan.json 2>/dev/null
          if git diff --quiet --staged; then
            echo "scan unchanged, skip"
          else
            git commit -m "scan $(date -u +%FT%TZ)"
            git push
          fi

  deep:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deep' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Deep refine
        run: |
          set +e
          python -u src/refine.py --l4 2>&1 | tee refine.log
          ec=$?
          if [ $ec -ne 0 ]; then echo "REFINE FAILED ec=$ec, last 40 lines:"; tail -40 refine.log; fi
          exit $ec
      - name: Commit + push if changed
        if: always() && !cancelled()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/refined.json 2>/dev/null
          if git diff --quiet --staged; then
            echo "refine unchanged, skip"
          else
            git commit -m "refine $(date -u +%FT%TZ)"
            git push
          fi
