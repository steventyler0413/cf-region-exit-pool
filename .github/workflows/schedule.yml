name: cf-region-exit-pool

on:
  schedule:
    - cron: "*/15 * * * *"   # fast scan
    - cron: "0 */6 * * *"    # deep refine (L4)
  workflow_dispatch:
    inputs:
      mode:
        description: "fast or deep"
        type: choice
        required: false
        default: fast
        options: [fast, deep]
      zipdiag:
        description: "zip reachability diag"
        type: boolean
        required: false
        default: false

jobs:
  fast:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Fast scan
        run: |
          set +e
          python -u src/scanner.py 2>&1 | tee scan.log
          ec=$?
          if [ $ec -ne 0 ]; then echo "SCAN FAILED ec=$ec, last 30 lines:"; tail -30 scan.log; fi
          exit $ec
      - name: Commit + push if changed
        if: always() && !cancelled()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scan.json scan.log 2>/dev/null
          if git diff --quiet --staged; then echo "scan unchanged, skip"; else
            git commit -q -m "fast scan $(date -u +%s)"
            git push -q
            echo "committed + pushed"
          fi

  deep:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deep' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Deep refine
        run: |
          set +e
          echo "=== refine.py L4 start $(date -u +%T) ==="
          python -u src/refine.py --l4 2>&1 | tee refine.log
          ec=$?
          echo "refine.py ec=$ec at $(date -u +%T)"
          # Always write a diagnostic file that captures what happened
          python3 - <<'PY'
          import json, os, time, socket, ssl, base64
          diag = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "runner": os.uname().nodename}
          # 1) can runner reach speed.cloudflare.com directly?
          try:
              import urllib.request
              t0=time.time()
              r=urllib.request.urlopen("https://speed.cloudflare.com/__down?bytes=100000", timeout=15)
              d=r.read(); diag["direct_speed_mbps"]=round(len(d)*8/1e6/max(time.time()-t0,0.001),1)
          except Exception as ex:
              diag["direct_speed_err"]=str(ex)[:80]
          # 2) VLESS-WS sample to a top HK node
          SNI="edgetunnel-hk.dreamtimecloudshare.com"
          for (ip,port) in [("207.57.123.112",443),("193.200.130.20",443)]:
              try:
                  s=socket.create_connection((ip,port),timeout=6)
                  ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
                  w=ctx.wrap_socket(s,server_hostname=SNI)
                  key=base64.b64encode(os.urandom(16)).decode()
                  w.sendall(f"GET / HTTP/1.1\r\nHost: {SNI}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n".encode())
                  w.settimeout(6); buf=b""
                  try:
                      while b"\r\n\r\n" not in buf: buf+=w.recv(1024)
                  except: pass
                  diag[f"vless_ws_{ip}"]=buf.split(b"\r\n")[0].decode(errors="replace")[:50] if buf else "no response"
                  w.close()
              except Exception as ex:
                  diag[f"vless_ws_{ip}"]=f"ERR:{ex}"[:60]
          # 3) does refined.json have L4 fields now?
          try:
              d=json.load(open("data/refined.json"))
              diag["refined_L4_enabled"]=d.get("L4_enabled")
              diag["refined_top_per_region"]=d.get("top_per_region")
              diag["refined_mb_gt0"]=sum(1 for x in d.get("items",[]) if (x.get("mbps") or 0)>0)
              diag["refined_ws_ok"]=sum(1 for x in d.get("items",[]) if x.get("ws_ok"))
              diag["refined_updated_at"]=d.get("updated_at")
          except Exception as ex:
              diag["refined_read_err"]=str(ex)[:60]
          json.dump(diag, open("l4_diag.json","w"), indent=2)
          print("diag:", json.dumps(diag, indent=2))
          PY
          echo "=== refine.py L4 end $(date -u +%T) ==="
          exit 0
      - name: Commit diag + data
        if: always() && !cancelled()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add l4_diag.json data/refined.json refine.log 2>/dev/null
          git commit -q -m "deep diag $(date -u +%s)" || echo "nothing to commit"
          git push -q || echo "push skip"


  zipdiag:
    if: ${{ inputs.zipdiag == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, json, time
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language":"zh-CN,zh;q=0.9,en;q=0.8",
              "Accept-Encoding":"gzip, deflate, br",
              "Referer":"https://www.google.com/",
              "Connection":"close"}
          out={}
          for label, url, follow in [
              ("root_no_redirect","https://zip.cm.edu.kg/",False),
              ("root_follow","https://zip.cm.edu.kg/",True),
              ("with_full_headers","https://zip.cm.edu.kg/",True),
          ]:
              entry={}
              try:
                  req=urllib.request.Request(url, headers=UA)
                  if not follow:
                      import http.client, ssl
                      c=http.client.HTTPSConnection("zip.cm.edu.kg")
                      c.request("GET","/",headers=UA)
                      r=c.getresponse()
                      entry["http_code"]=r.status
                      entry["final_url"]=r.getheader("Location","")
                      entry["size"]=0
                  else:
                      t0=time.time()
                      r=urllib.request.urlopen(req, timeout=60)
                      data=r.read()
                      entry["http_code"]=200
                      entry["final_url"]=r.geturl()
                      entry["size"]=len(data)
                      entry["seconds"]=round(time.time()-t0,1)
                      entry["content_type"]=r.headers.get("Content-Type","")
                      entry["is_zip"]=data[:4]==b"PK\x03\x04"
                  out[label]=entry
              except urllib.error.HTTPError as ex:
                  out[label]={"http_code":ex.code,"error":str(ex)[:80]}
              except Exception as ex:
                  out[label]={"error":str(ex)[:80]}
              time.sleep(1)
          json.dump(out, open("diag_zip.json","w"), indent=2)
          print("zip diag:", json.dumps(out, indent=2))
          PY
      - name: Commit diag
        if: always()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add diag_zip.json
          git commit -q -m "zip diag $(date -u +%s)" || echo "no change"
          git push -q || echo "push skip (no write token)"
