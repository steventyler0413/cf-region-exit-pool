name: cf-region-exit-pool

on:
  schedule:
    - cron: "*/15 * * * *"   # fast scan
    - cron: "0 */6 * * *"    # deep refine (L4)
  workflow_dispatch:
    inputs:
      mode:
        description: "fast or deep"
        type: choice
        required: false
        default: fast
        options: [fast, deep]
      zipdiag:
        description: "zip reachability diag"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  fast:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Fast scan
        run: |
          set +e
          python -u src/scanner.py 2>&1 | tee scan.log
          ec=$?
          if [ $ec -ne 0 ]; then echo "SCAN FAILED ec=$ec, last 30 lines:"; tail -30 scan.log; fi
          exit $ec
      - name: Commit + push if changed
        if: always() && !cancelled()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scan.json scan.log 2>/dev/null
          if git diff --quiet --staged; then echo "scan unchanged, skip"; else
            git commit -q -m "fast scan $(date -u +%s)"
            git push -q origin main
            echo "committed + pushed"
          fi

  deep:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deep' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Deep refine
        run: |
          set +e
          echo "=== refine.py L4 start $(date -u +%T) ==="
          python -u src/refine.py --l4 2>&1 | tee refine.log
          ec=$?
          echo "refine.py ec=$ec at $(date -u +%T)"
          # Always write a diagnostic file that captures what happened
          python3 - <<'PY'
          import json, os, time, socket, ssl, base64
          diag = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "runner": os.uname().nodename}
          # 1) can runner reach speed.cloudflare.com directly?
          try:
              import urllib.request
              t0=time.time()
              r=urllib.request.urlopen("https://speed.cloudflare.com/__down?bytes=100000", timeout=15)
              d=r.read(); diag["direct_speed_mbps"]=round(len(d)*8/1e6/max(time.time()-t0,0.001),1)
          except Exception as ex:
              diag["direct_speed_err"]=str(ex)[:80]
          # 2) VLESS-WS sample to a top HK node
          SNI="edgetunnel-hk.dreamtimecloudshare.com"
          for (ip,port) in [("207.57.123.112",443),("193.200.130.20",443)]:
              try:
                  s=socket.create_connection((ip,port),timeout=6)
                  ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
                  w=ctx.wrap_socket(s,server_hostname=SNI)
                  key=base64.b64encode(os.urandom(16)).decode()
                  w.sendall(f"GET / HTTP/1.1\r\nHost: {SNI}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n".encode())
                  w.settimeout(6); buf=b""
                  try:
                      while b"\r\n\r\n" not in buf: buf+=w.recv(1024)
                  except: pass
                  diag[f"vless_ws_{ip}"]=buf.split(b"\r\n")[0].decode(errors="replace")[:50] if buf else "no response"
                  w.close()
              except Exception as ex:
                  diag[f"vless_ws_{ip}"]=f"ERR:{ex}"[:60]
          # 3) does refined.json have L4 fields now?
          try:
              d=json.load(open("data/refined.json"))
              diag["refined_L4_enabled"]=d.get("L4_enabled")
              diag["refined_top_per_region"]=d.get("top_per_region")
              diag["refined_mb_gt0"]=sum(1 for x in d.get("items",[]) if (x.get("mbps") or 0)>0)
              diag["refined_ws_ok"]=sum(1 for x in d.get("items",[]) if x.get("ws_ok"))
              diag["refined_updated_at"]=d.get("updated_at")
          except Exception as ex:
              diag["refined_read_err"]=str(ex)[:60]
          json.dump(diag, open("l4_diag.json","w"), indent=2)
          print("diag:", json.dumps(diag, indent=2))
          PY
          echo "=== refine.py L4 end $(date -u +%T) ==="
          exit 0
      - name: L4 single-IP debug (dl.google.com via VLESS tunnel)
        if: always() && !cancelled()
        run: |
          python3 - <<'PY'
          import socket,ssl,base64,os,struct,time
          UUIDH="d37f6de7d1b24fe6a321242878dca3b8"
          SNI="edgetunnel-hk.dreamtimecloudshare.com"
          IP,PORT="207.57.123.112",443  # top HK
          def ws_handshake(w):
              key=base64.b64encode(os.urandom(16)).decode()
              w.sendall(f"GET / HTTP/1.1\r\nHost: {SNI}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n".encode())
              w.settimeout(6); buf=b""
              try:
                  while b"\r\n\r\n" not in buf: buf+=w.recv(1024)
              except: pass
              return buf.split(b"\r\n")[0].decode(errors="replace")
          def build_vless_connect(host_ip, port):
              b=bytearray(); b.append(0); b+=bytes.fromhex(UUIDH); b.append(1); b.append(1)
              b+=socket.inet_aton(host_ip); b+=struct.pack(">H",port); return bytes(b)
          def ws_bin(w,payload):
              m=os.urandom(4); ln=len(payload); f=bytearray([0x82])
              if ln<126: f.append(0x80|ln)
              else: f.append(0x80|126); f+=struct.pack(">H",ln)
              f+=m; f+=bytes(b^m[i%4] for i,b in enumerate(payload)); w.sendall(bytes(f))
          s=socket.create_connection((IP,PORT),timeout=8)
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          w=ctx.wrap_socket(s,server_hostname=SNI)
          print("WS upgrade:", ws_handshake(w))
          # VLESS connect to dl.google.com:443 then TLS + GET 1MB
          ws_bin(w, build_vless_connect("dl.google.com",443))
          # now the tunnel should carry TLS to dl.google.com; we must do TLS handshake inside
          # But we already wrapped the outer socket in TLS (to the edge IP). The VLESS target
          # is a TCP stream, so after the VLESS connect the edge forwards raw TCP to target.
          # For dl.google.com:443 we need TLS on top. Send TLS ClientHello:
          import ssl as _ssl2
          # Actually simpler: VLESS connect to dl.google.com:80 (plain HTTP) to avoid inner TLS
          w.close()
          # retry with port 80
          s2=socket.create_connection((IP,PORT),timeout=8)
          ctx2=ssl.create_default_context(); ctx2.check_hostname=False; ctx2.verify_mode=ssl.CERT_NONE
          w2=ctx2.wrap_socket(s2,server_hostname=SNI)
          print("WS upgrade2:", ws_handshake(w2))
          ws_bin(w2, build_vless_connect("dl.google.com",80))
          # send HTTP GET 1MB
          w2.sendall(b"GET /chrome/linux/current/chrome-linux64-64.deb HTTP/1.1\r\nHost: dl.google.com\r\nRange: bytes=0-1048575\r\n\r\n")
          w2.settimeout(8); got=0; t0=time.time()
          try:
              while got<1048576:
                  c2=w2.recv(65536)
                  if not c2: break
                  got+=len(c2)
          except socket.timeout: pass
          dt=max(time.time()-t0,0.001)
          print(f"VLESS->dl.google.com:80 GET 1MB: got {got} bytes in {dt:.1f}s = {got*8/1e6/dt:.1f} Mbps")
          PY

      - name: VLESS-WS raw tunnel probe
        if: always() && !cancelled()
        run: |
          python3 - <<'PY'
          import socket, ssl, base64, os, struct, time
          SNI="edgetunnel-hk.dreamtimecloudshare.com"
          IP,PORT="207.57.123.112",443

          def ws_handshake(w):
              key=base64.b64encode(os.urandom(16)).decode()
              w.sendall(f"GET / HTTP/1.1\r\nHost: {SNI}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n".encode())
              w.settimeout(6); buf=b""
              try:
                  while b"\r\n\r\n" not in buf: buf+=w.recv(1024)
              except: pass
              return buf.split(b"\r\n")[0].decode(errors="replace")

          def ws_send_bin(w, payload):
              m=os.urandom(4); ln=len(payload); f=bytearray([0x82])
              if ln<126: f.append(0x80|ln)
              else: f.append(0x80|126); f+=struct.pack(">H",ln)
              f+=m; f+=bytes(b^m[i%4] for i,b in enumerate(payload)); w.sendall(bytes(f))

          def ws_recv_bin(w):
              b1=w.recv(1); b2=w.recv(1)
              if not b1 or not b2: return b""
              ln=b2[0]&0x7F
              if ln==126: ln=struct.unpack(">H",w.recv(2))[0]
              elif ln==127: ln=struct.unpack(">Q",w.recv(8))[0]
              payload=b""
              while len(payload)<ln:
                  c=w.recv(ln-len(payload))
                  if not c: break
                  payload+=c
              return payload

          s=socket.create_connection((IP,PORT),timeout=8)
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          w=ctx.wrap_socket(s,server_hostname=SNI)
          print("WS upgrade:", ws_handshake(w))

          # Test 1: send raw TLS ClientHello through WS binary, no VLESS frames
          # This simulates: "what does the tunnel do with arbitrary bytes?"
          # Build a minimal TLS 1.2 ClientHello
          tls_hello = bytes([
              0x16, 0x03, 0x01, 0x00, 0x80,  # handshake, TLS 1.2, length ~0x80
              0x01, 0x00, 0x00, 0x7C,       # client hello
              0x03, 0x03,                     # TLS 1.2 + random
          ]) + os.urandom(32) + bytes([0x00, 0x00,  # session id
              0x00, 0x02, 0x13, 0x01,        # 1 cipher: TLS_AES_128_GCM_SHA256
              0x00, 0x01, 0x00,             # compression: null
              0x00, 0x0A,                   # extensions: server_name
              0x00, 0x00, 0x00, 0x08, 0x00, 0x06,
              0x00, 0x01, 0x00, 0x05, 0x03, 0x00, 0x00,
              0x65, 0x64, 0x67, 0x65, 0x74, 0x65, 0x74, 0x75, 0x6E, 0x6E, 0x65, 0x6C, 0x2D, 0x68, 0x6B,
              # pad to length
          ])
          print(f"TLS ClientHello {len(tls_hello)} bytes, sending through WS binary...")
          ws_send_bin(w, tls_hello)
          w.settimeout(6)
          try:
              resp = ws_recv_bin(w)
              print(f"Got {len(resp)} bytes back: {resp[:40].hex()}")
          except socket.timeout:
              print("No response to raw TLS hello within 6s")

          # Test 2: VLESS connect frame to a known working target (spurl IP:443)
          import socket as _sk
          try:
              tgt_ip = _sk.gethostbyname("spurl.api.030101.xyz")
              print(f"spurl IP: {tgt_ip}")
          except:
              tgt_ip = None
              print("spurl DNS failed")
          if tgt_ip:
              uuid_hex = "d37f6de7d1b24fe6a321242878dca3b8"
              vless_frame = bytearray()
              vless_frame.append(0)  # version
              vless_frame += bytes.fromhex(uuid_hex)
              vless_frame.append(1)  # cmd=connect
              vless_frame.append(1)  # type=ipv4
              vless_frame += _sk.inet_aton(tgt_ip)
              vless_frame += struct.pack(">H", 443)
              print(f"VLESS connect frame to {tgt_ip}:443, {len(vless_frame)} bytes")
              ws_send_bin(w, bytes(vless_frame))
              w.settimeout(6)
              try:
                  got = 0; t0=time.time()
                  while time.time()-t0 < 5:
                      data = ws_recv_bin(w)
                      if not data: break
                      got += len(data)
                  print(f"After VLESS connect: {got} bytes in {time.time()-t0:.1f}s")
              except socket.timeout:
                  print("No data after VLESS connect (timeout)")
          w.close()
          PY

      - name: L4 verbose debug (single IP)
        if: always() && !cancelled()
        run: |
          python3 - <<'PY'
          import socket, ssl, base64, os, struct, time
          IP, PORT = "207.57.123.112", 443
          SNI = "edgetunnel-hk.dreamtimecloudshare.com"
          BACKEND_HOST = "spurl.api.030101.xyz"
          UUID_HEX = "d37f6de7d1b24fe6a321242878dca3b8"

          def resolve_ip(host):
              try:
                  socket.inet_aton(host)
                  return host
              except OSError:
                  return socket.gethostbyname(host)

          backend_ip = resolve_ip(BACKEND_HOST)
          print(f"spurl IP: {backend_ip}")

          def ws_handshake(w):
              key = base64.b64encode(os.urandom(16)).decode()
              w.sendall(f"GET / HTTP/1.1\r\nHost: {SNI}\r\nUpgrade: websocket\r\n"
                        f"Connection: Upgrade\r\nSec-WebSocket-Key: {key}\r\n"
                        f"Sec-WebSocket-Version: 13\r\n\r\n".encode())
              w.settimeout(6); buf = b""
              try:
                  while b"\r\n\r\n" not in buf:
                      buf += w.recv(1024)
              except: pass
              first_line = buf.split(b"\r\n")[0].decode(errors="replace")
              print(f"WS handshake: {first_line}")
              return b"101" in buf

          def ws_send_bin(w, payload):
              m = os.urandom(4); ln = len(payload)
              f = bytearray([0x82])
              if ln < 126: f.append(0x80 | ln)
              else: f.append(0x80 | 126); f += struct.pack(">H", ln)
              f += m; f += bytes(b ^ m[i%4] for i, b in enumerate(payload))
              w.sendall(bytes(f))

          def ws_recv_bin(w):
              b1 = w.recv(1); b2 = w.recv(1)
              if not b1 or not b2: return b""
              ln = b2[0] & 0x7F
              if ln == 126: ln = struct.unpack(">H", w.recv(2))[0]
              elif ln == 127: ln = struct.unpack(">Q", w.recv(8))[0]
              data = b""
              while len(data) < ln:
                  chunk = w.recv(ln - len(data))
                  if not chunk: break
                  data += chunk
              return data

          s = socket.create_connection((IP, PORT), timeout=8)
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          w = ctx.wrap_socket(s, server_hostname=SNI)
          ok = ws_handshake(w)
          print(f"101: {ok}")
          if not ok:
              w.close(); exit()

          # VLESS connect frame to spurl IP:443
          vless = bytearray()
          vless.append(0); vless += bytes.fromhex(UUID_HEX); vless.append(1); vless.append(1)
          vless += socket.inet_aton(backend_ip); vless += struct.pack(">H", 443)
          print(f"VLESS frame: {len(vless)} bytes -> {backend_ip}:443")
          ws_send_bin(w, bytes(vless))

          # Read what the server sends back
          w.settimeout(8)
          try:
              resp = ws_recv_bin(w)
              print(f"Server response: {len(resp)} bytes, first bytes: {resp[:20].hex()}")
              if resp[:4] == b"HTTP":
                  print(f"  -> HTTP response (not TLS)")
              elif resp[:1] == b'\x16':
                  print(f"  -> TLS ServerHello (inner TLS needed)")
              elif resp[:1] == b'\x15':
                  print(f"  -> TLS Alert")
              else:
                  print(f"  -> Unknown first byte: {resp[:1].hex() if resp else 'empty'}")
          except socket.timeout:
              print("No server response to VLESS frame within 8s (timeout)")

          w.close()
          PY

      - name: Commit diag + data
        if: always() && !cancelled()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add l4_diag.json data/refined.json refine.log 2>/dev/null
          git commit -q -m "deep diag $(date -u +%s)" || echo "nothing to commit"
          git push -q origin main || echo "push skip"


  zipdiag:
    if: ${{ inputs.zipdiag == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, json, time
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language":"zh-CN,zh;q=0.9,en;q=0.8",
              "Accept-Encoding":"gzip, deflate, br",
              "Referer":"https://www.google.com/",
              "Connection":"close"}
          out={}
          for label, url, follow in [
              ("root_no_redirect","https://zip.cm.edu.kg/",False),
              ("root_follow","https://zip.cm.edu.kg/",True),
              ("with_full_headers","https://zip.cm.edu.kg/",True),
          ]:
              entry={}
              try:
                  req=urllib.request.Request(url, headers=UA)
                  if not follow:
                      import http.client, ssl
                      c=http.client.HTTPSConnection("zip.cm.edu.kg")
                      c.request("GET","/",headers=UA)
                      r=c.getresponse()
                      entry["http_code"]=r.status
                      entry["final_url"]=r.getheader("Location","")
                      entry["size"]=0
                  else:
                      t0=time.time()
                      r=urllib.request.urlopen(req, timeout=60)
                      data=r.read()
                      entry["http_code"]=200
                      entry["final_url"]=r.geturl()
                      entry["size"]=len(data)
                      entry["seconds"]=round(time.time()-t0,1)
                      entry["content_type"]=r.headers.get("Content-Type","")
                      entry["is_zip"]=data[:4]==b"PK\x03\x04"
                  out[label]=entry
              except urllib.error.HTTPError as ex:
                  out[label]={"http_code":ex.code,"error":str(ex)[:80]}
              except Exception as ex:
                  out[label]={"error":str(ex)[:80]}
              time.sleep(1)
          json.dump(out, open("diag_zip.json","w"), indent=2)
          print("zip diag:", json.dumps(out, indent=2))
          PY
      - name: Commit diag
        if: always()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add diag_zip.json
          git commit -q -m "zip diag $(date -u +%s)" || echo "no change"
          git push -q origin main || echo "push failed"
          echo "=== diag_zip.json ==="
          cat diag_zip.json
