name: cf-region-exit-pool

on:
  schedule:
    - cron: "*/15 * * * *"   # fast scan
    - cron: "0 */6 * * *"    # deep refine
  workflow_dispatch:
    inputs:
      mode:
        description: "fast or deep"
        type: choice
        required: false
        default: "fast"
        options: ["fast", "deep"]

jobs:
  fast:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Fast scan (alive + latency, 4 regions x 2 ports)
        run: python src/scanner.py
      - name: Commit + push if changed
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scan.json
          if git diff --quiet --staged; then
            echo "scan unchanged, skip commit"
          else
            git commit -m "scan $(date -u +%FT%TZ)"
            git push
          fi

  deep:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deep' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Deep refine (L1+L2+L3+L4 on runner egress)
        run: python src/refine.py --l4
      - name: Commit + push if changed
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/refined.json
          if git diff --quiet --staged; then
            echo "refine unchanged, skip commit"
          else
            git commit -m "refine $(date -u +%FT%TZ)"
            git push
          fi
