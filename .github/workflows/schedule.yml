name: cf-region-exit-pool

on:
  schedule:
    - cron: "0 */6 * * *"    # deep refine (L4/L5) every 6h
  workflow_dispatch:
    inputs:
      mode:
        description: "deep"
        type: choice
        required: false
        default: deep
        options: [deep]

permissions:
  contents: write
  actions: read

jobs:
  deep:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'deep' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Deep refine (L4/L5)
        run: |
          set +e
          echo "=== refine.py L4 start $(date -u +%T) ==="
          python -u src/refine.py --l4 2>&1 | tee refine.log
          ec=$?
          echo "refine.py ec=$ec at $(date -u +%T)"
      - name: Commit + push if changed
        if: always() && !cancelled()
        run: |
          git config user.name "cf-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/refined.json refine.log 2>/dev/null
          if git diff --quiet --staged; then echo "refine unchanged, skip"; else
            git commit -q -m "deep refine $(date -u +%s)"
            git push -q origin main
            echo "committed + pushed"
          fi
